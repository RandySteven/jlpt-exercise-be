name: Go CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write # Required if pushing to GitHub Packages (ghcr.io)

jobs:
  # 1. Linting Job
  lint:
    name: Lint Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60 # Specify your preferred golangci-lint version

  # 2. Vendor Validation Job
  vendor-validate:
    name: Validate Vendor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check vendor consistency
        run: |
          go mod tidy
          go mod vendor
          # Check if git status is clean. If go.mod, go.sum, or vendor/ changed, fail the build.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Vendor directory or go.mod/go.sum is out of sync. Run 'go mod tidy && go mod vendor' locally and commit changes."
            git diff
            exit 1
          fi

  # 3. Unit Testing Job
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, vendor-validate] # Runs in parallel after lint and vendor checks pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  # 4. Compilation (Build) Job
  compile:
    name: Compile Binary
    runs-on: ubuntu-latest
    needs: [test] # Only build if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binary
        run: |
          # CGO_ENABLED=0 ensures a statically linked binary (perfect for minimal Docker images)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o myapp ./main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-binary
          path: myapp
          retention-days: 1

  # 5. Docker Image Generation Job
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [compile] # Requires the compiled binary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp-binary
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional: Log in to GitHub Container Registry (GHCR)
      # Uncomment if you want to push the image to GitHub's registry
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true and configure tags if pushing to a registry
          tags: myapp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max