configs:
  # HTTP Server Configuration
  server:
    host: "0.0.0.0"
    port: "8080"
    timeout:
      server: 30
      read: 15
      write: 10
      idle: 5

  # Database Configuration
  db:
    db: "postgresql"
    host: "localhost"
    port: "5432"
    ssl_mode: "disable"
    dbname: "postgres"
    dbuser: "postgres"
    dbpass: ""
    max_idle_conns: 10
    max_open_conns: 8
    conn_max_lifetime: 10
    conn_max_idletime: 8

  # MongoDB Configuration
  mongodb:
    user: "your_user"
    password: "your_password"
    host: "localhost:27017"
    dbname: "your_database"

  # Redis Cache Configuration
  redis:
    host: "localhost"
    port: "6379"
    password: ""
    pool_size: 10
    min_idle_conn: 2
    max_idle_conn: 5
    pool_timeout: 4
    dial_timeout: 5
    read_timeout: 3
    write_timeout: 3
    max_retries: 3
    max_retry_backoff: 512
    min_retry_backoff: 8
    conn_max_idle_time: 5
    conn_max_life_time: 30

  # NSQ Message Queue Configuration
  nsq:
    host: "localhost"
    tcp_port: "4150"
    lookup_http_port: "4161"
    max_in_flight: 10
    concurrent_consumer: 1
    read_timeout: 60
    write_timeout: 30
    heartbeat_interval: 30
    backoff_multiplier: 2
    max_backoff_duration: 120

  # Temporal Workflow Configuration
  temporal:
    host: "localhost"
    port: "7233"
    task_queue: "your_task_queue"
    namespace: "default"
    workerOptions:
      maxConcurrentActivityExecutionSize: 100
      workerActivitiesPerSecond: 100.0
      maxConcurrentLocalActivityExecutionSize: 100
      workerLocalActivitiesPerSecond: 100.0
